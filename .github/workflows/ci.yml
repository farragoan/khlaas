# Until this existed, nothing ran the test suite. 92 tests were in the repo and
# every one of them only ran when somebody remembered to. A bug therefore had no
# way to be caught before a user hit it in production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      # Lint does not gate yet. Turning it on revealed 13 pre-existing React
      # Compiler errors that predate CI — mostly setState-inside-effect, plus
      # the memoization break in hooks/use-table-data.ts that makes the table
      # page re-fetch in a loop. A permanently red gate teaches everyone to
      # ignore CI, which is worse than no gate, so it reports without blocking.
      # Drive this to zero and delete continue-on-error; do not raise the
      # allowance to accommodate new violations.
      - name: Lint (reporting only — 13 known errors, must reach 0)
        run: pnpm run lint
        continue-on-error: true

      # Migrations are dbmate files in db/migrations. This lints them and, against
      # a throwaway Postgres service (localhost only; the script refuses any other
      # host), proves up -> full rollback -> up and that db/schema.sql is not stale.
      - name: Install pg_dump 16 (dbmate schema dump)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - name: Migrations apply, roll back and re-apply; schema.sql current
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/khlaas_ci?sslmode=disable
          PATH_PG: /usr/lib/postgresql/16/bin
        run: PATH="$PATH_PG:$PATH" bash scripts/db-check.sh
