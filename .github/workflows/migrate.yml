name: Apply DB migrations

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DATABASE_URL
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PREREQUISITE: production must be bootstrapped once (see docs/migrations.md),
      # otherwise dbmate tries to run 0000 against existing tables. That fails
      # safe (each migration is one transaction) but the job goes red.
      - run: pnpm run db:up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DBMATE_NO_DUMP_SCHEMA: "true"
