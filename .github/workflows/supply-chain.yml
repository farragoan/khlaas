# Supply-chain checks: OSV-Scanner, Semgrep (OSS rules), Betterleaks, Syft SBOM,
# and an informational dependency audit. Every third-party action is pinned to a
# full commit SHA (the tag is in the trailing comment). Do not replace SHAs with tags.
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

# Deny by default; each job grants itself only what it needs.
permissions: {}

jobs:
  osv-scanner:
    name: OSV-Scanner (lockfile CVEs)
    runs-on: ubuntu-latest
    # Reporting only until the existing backlog is cleared; then delete this line.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  semgrep:
    name: Semgrep (OSS rules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Install Semgrep (pinned)
        run: pip install --no-cache-dir semgrep==1.182.0
      - name: Scan
        run: >-
          semgrep scan --metrics=off --error
          --config p/javascript --config p/typescript --config p/owasp-top-ten
          --severity ERROR --exclude node_modules --exclude dist --exclude build .

  betterleaks:
    name: Betterleaks (secret scan, gitleaks successor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BETTERLEAKS_VERSION: "1.9.0"
      # sha256 of betterleaks_1.9.0_linux_x64.tar.gz from the release checksums.txt
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks (checksum-verified)
        run: |
          curl -fsSL -o bl.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  bl.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bl" && tar -xzf bl.tar.gz -C "$RUNNER_TEMP/bl" betterleaks
          echo "$RUNNER_TEMP/bl" >> "$GITHUB_PATH"
      - name: Scan git history (secrets redacted in output)
        run: betterleaks git --redact --no-banner -c .betterleaks.toml .

  sbom:
    name: SBOM (Syft, CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact: true

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: pnpm audit --prod (.)
        working-directory: .
        run: pnpm audit --prod
        continue-on-error: true
